<!doctype html>
<html lang="en-GB">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Depth of Field Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            background: #e0daec;
            color: #360457;
            font: 1rem/1.5 system-ui, sans-serif;
        }

        main {
            max-width: 40rem;
            margin: auto;
            padding: clamp(1rem, 4vw, 2rem);
            background: white;
            border: 1px solid #9684b6;
        }

        h1 {
            margin: 0 0 0.5rem;
        }

        h2 {
            font-size: 1.25rem;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
            gap: 1rem;
        }

        label {
            display: block;
            font-weight: 600;
        }

        input,
        button {
            font: inherit;
            padding: 0.6rem 0.75rem;
            border: 1px solid #9684b6;
        }

        input {
            width: 100%;
            margin-top: 0.25rem;
            color: inherit;
        }

        button {
            margin-top: 1rem;
            background: #5a308d;
            color: white;
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid #360457;
            outline-offset: 3px;
        }

        dl {
            margin-bottom: 0;
        }

        dl div {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.55rem 0;
            border-top: 1px solid #e0daec;
        }

        dd {
            margin: 0;
            font-weight: 600;
            text-align: right;
        }

        #error {
            color: #9b1734;
        }
    </style>
</head>

<body>
    <main>
        <h1>Depth of Field Calculator</h1>
        <p>Find the range of distances that will appear acceptably sharp.</p>

        <form id="calculator">
            <div class="fields">
                <label>
                    Focal length (mm)
                    <input id="focal-length" type="number" min="0.1" step="any" value="50" required>
                </label>

                <label>
                    Aperture (f-number)
                    <input id="aperture" type="number" min="0.1" step="any" value="8" required>
                </label>


                <label>
                    Focus distance (cm)
                    <input id="focus-distance" type="number" min="0.1" step="any" value="300" required>
                </label>
                <label>
                    Circle of confusion (mm)
                    <input id="circle-of-confusion" type="number" min="0.001" step="any" value="0.030" required
                        aria-describedby="coc-help">
                </label>
            </div>

            <p id="coc-help">
                Typical starting values are 0.030 mm for full frame,
                0.020 mm for APS-C and 0.015 mm for Micro Four Thirds.
            </p>

            <button type="submit">Calculate</button>
        </form>

        <p id="error" role="alert" hidden></p>

        <section id="results" aria-live="polite" aria-labelledby="results-heading">
            <h2 id="results-heading">Results</h2>
            <dl>
                <div>
                    <dt>Near sharpness limit</dt>
                    <dd id="near"></dd>
                </div>
                <div>
                    <dt>Far sharpness limit</dt>
                    <dd id="far"></dd>
                </div>
                <div>
                    <dt>Total depth of field</dt>
                    <dd id="depth"></dd>
                </div>
                <div>
                    <dt>Hyperfocal distance</dt>
                    <dd id="hyperfocal"></dd>
                </div>
            </dl>
        </section>
    </main>

    <script>
        const byId = id => document.getElementById(id);
        const form = byId("calculator");
        const error = byId("error");
        const results = byId("results");

        function calculateDOF(focalLength, aperture, focusDistanceM, coc) {
            const focusDistance = focusDistanceM * 1000;
            if (focusDistance <= focalLength) {
                throw new RangeError(
                    "Focus distance must be greater than the focal length. Check the units."
                );
            }

            const h = focalLength ** 2 / (aperture * coc);
            const hyperfocal = h + focalLength;
            const near = h * focusDistance / (h + focusDistance - focalLength);
            const far = focusDistance >= hyperfocal
                ? Infinity
                : h * focusDistance / (hyperfocal - focusDistance);

            return {
                near: near / 1000,
                far: far / 1000,
                depth: (far - near) / 1000,
                hyperfocal: hyperfocal / 1000
            };
        }

        function formatDistance(metres) {
            if (metres === Infinity) return "Infinity";
            if (metres < 0.1) return `${(metres * 1000).toFixed(1)} mm`;
            return `${metres.toFixed(2)} m`;
        }

        function updateResults() {
            error.hidden = true;

            try {
                const distances = calculateDOF(
                    byId("focal-length").valueAsNumber,
                    byId("aperture").valueAsNumber,
                    byId("focus-distance").valueAsNumber,
                    byId("circle-of-confusion").valueAsNumber
                );

                for (const [id, distance] of Object.entries(distances)) {
                    byId(id).textContent = formatDistance(distance);
                }
                results.hidden = false;
            } catch (problem) {
                results.hidden = true;
                error.textContent = problem.message;
                error.hidden = false;
            }
        }

        form.addEventListener("submit", event => {
            event.preventDefault();
            updateResults();
        });

        updateResults();
    </script>
</body>

</html>
